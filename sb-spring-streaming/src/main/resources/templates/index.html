<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .video-container {
            position: relative;
            width: 300px;
            height: 500px;
            overflow: hidden;
        }

        video {
            width:100%;
            height:100%;
            object-fit: cover;
        }
        /* 모바일에서 최소 높이 적용 */
        @media (max-width: 768px) {
            .video-container {
                min-height: 400px; /* 최소 높이를 400px로 설정 */
                height: 100vw;
            }
        }
    </style>
</head>
<body>

<div class="video-container">
    <video loop autoplay muted playsinline controls >
        not use video
        <source src="/download?fileName=test.mkv" type="video/mp4">
    </video>
</div>

</body>
</html>
