spring:
  elasticsearch:
    host: localhost:9200
    uris: http://localhost:9200
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL;
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true

server:
  port: 8080