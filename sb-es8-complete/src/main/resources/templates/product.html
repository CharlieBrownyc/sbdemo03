<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        #suggestions {
            border: 1px solid #ccc;
            max-height: 150px;
            overflow-y: auto;
            list-style: none;
            margin: 0;
            padding: 0;
            position: absolute;
            background-color: white;
            width: 200px;
        }

        #suggestions li {
            padding: 8px;
            cursor: pointer;
        }

        #suggestions li:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
<h2>Data input</h2>
<form action="#" th:action="@{/products}" th:object="${productDto}" method="post">
    <input type="text" th:field="*{name}" placeholder="제목을 입력하세요" required />
    <input type="text" th:field="*{content}" placeholder="내용을 입력하세요" required/>
    <button type="submit">저장</button>
</form>
<h2>AutoComplete</h2>
<input id="searchBox" type="text" oninput="doAutocomplete()" autocomplete="off" />
<ul id="suggestions"></ul>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const searchBox = document.getElementById('searchBox');
        const suggestions = document.getElementById('suggestions');

        let timeout = null;

        searchBox.addEventListener('input', () => {
            clearTimeout(timeout);
            const query = searchBox.value.trim();

            // if (query.length < 2) {
            //     suggestions.innerHTML = '';
            //     return;
            // }

            // 디바운싱
            timeout = setTimeout(() => {
                fetch(`/api/v1/search?query=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(data => {
                        suggestions.innerHTML = '';
                        data.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = item;
                            li.addEventListener('click', () => {
                                searchBox.value = item;
                                suggestions.innerHTML = '';
                            });
                            suggestions.appendChild(li);
                        });
                    })
                    .catch(error => console.error('Error fetching suggestions:', error));
            }, 300);
        });
    });
    /*<!--
    function doAutocomplete() {
        const query = document.getElementById('searchBox').value;
        fetch(`/search?query=${query}`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('suggestions');
                list.innerHTML = '';
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.innerText = item;
                    list.appendChild(li);
                });
            });
    }
    -->*/
</script>
</body>
</html>
